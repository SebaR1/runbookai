name: runbookai

# Infraestructura (mongo, azurite, chroma) y apps (rag-service, system-api, front).
# Ollama corre en el host Windows, no acá.
#
# Las direcciones internas (chroma:8000, azurite:10000, rag-service:8000) van en
# el "environment:" de cada servicio, no en .env (ver .env.example).
#
# Los puertos se publican solo en 127.0.0.1: accesibles desde la máquina,
# no desde la red local.

services:
  mongo:
    image: mongo:8.0.38
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?definir en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?definir en .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.38.0
    restart: unless-stopped
    # --loose: tolera headers que Azurite no implementa.
    # --skipApiVersionCheck: evita fallos cuando el SDK es más nuevo que el emulador.
    command: >
      azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
      --location /data --loose --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000" # Blob
      - "127.0.0.1:10001:10001" # Queue (para la ingesta asíncrona, Fase 8)
      - "127.0.0.1:10002:10002" # Table
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "False"
    ports:
      - "127.0.0.1:8001:8000" # 8001 en el host para no chocar con el rag-service (8000)
    volumes:
      - chroma-data:/data
    healthcheck:
      # La imagen no trae curl: se hace el GET con /dev/tcp de bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8000 &&
          printf 'GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q ' 200 ' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rag-service:
    build: ./rag-service
    restart: unless-stopped
    environment:
      CHROMA_URL: http://chroma:8000
      # Ollama en el host Windows (la GPU AMD no llega a los contenedores).
      OPENAI_BASE_URL: http://host.docker.internal:11434/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
    extra_hosts:
      - "host.docker.internal:host-gateway" # automático en Docker Desktop; explícito para Linux
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      # /health también verifica Ollama y los modelos: unhealthy si Ollama está apagado.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  system-api:
    build: ./system-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development # Swagger UI en /swagger
      Mongo__ConnectionString: mongodb://mongo:27017
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:?definir en .env}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?definir en .env}
      # Cuenta y clave públicas de Azurite (no son un secreto). UseDevelopmentStorage=true
      # apunta a 127.0.0.1, que dentro del contenedor es el propio contenedor.
      Blob__ConnectionString: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      Rag__BaseUrl: http://rag-service:8000
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      # Sin Mongo ni Azurite no arranca (crea índices y contenedor al iniciar).
      mongo:
        condition: service_healthy
      azurite:
        condition: service_healthy
      # Sin el RAG sí puede funcionar: los documentos quedan en error y se reindexan después.
      rag-service:
        condition: service_started
    healthcheck:
      # La imagen de aspnet no trae curl: GET con /dev/tcp de bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q ' 200 ' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  front:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80" # http://localhost:8080
    depends_on:
      system-api:
        condition: service_healthy
    healthcheck:
      # busybox wget viene en la imagen alpine de nginx.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo-data:
  azurite-data:
  chroma-data:
