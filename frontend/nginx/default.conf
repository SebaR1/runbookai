# Serves the Angular SPA and proxies /api/* to the System API (same origin: no CORS).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # nginx accepts 1 MB by default; the System API accepts up to 20 MB (Documents__MaxFileSizeBytes).
    # A bit more than 20 MB for the multipart overhead. Above it nginx answers 413 itself,
    # as ProblemDetails like the System API (the front reads "detail").
    client_max_body_size 21m;
    error_page 413 = @too_large;
    location @too_large {
        default_type application/problem+json;
        return 413 '{"title":"Archivo demasiado grande","status":413,"detail":"El archivo supera el máximo de 20 MB."}';
    }

    # Docker's DNS, re-resolved every 10 s. With a fixed name in proxy_pass, nginx resolves
    # it once at startup and keeps the old IP when the system-api container is recreated
    # (docker compose up -d --build system-api), answering 502 until restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $system_api http://system-api:8080;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- System API ---

    # Chat (SSE): nothing is buffered, or the tokens arrive all at once at the end.
    # The System API also sends X-Accel-Buffering: no; this keeps it explicit here.
    # Matches GET too (list of messages): harmless.
    location ~ ^/api/conversations/[^/]+/messages$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $system_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # Longer than Rag__AskTimeout (3 min): the System API ends the stream first.
        proxy_read_timeout 300s;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $system_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- SPA ---

    # Files with a content hash in the name (main-AVOBKSVH.js): cached for a year.
    location ~* "-[A-Za-z0-9_]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html always revalidated: it points to the current hashed files.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Angular routes (/chat/123, /documents) are not files: they get index.html
    # and the router resolves them in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
